[workspace]
resolver = "3"
members = [
  "games/arcade_core",
  "games/snake",
  "games/pong",
  "games/breakout",
  "games/tetris",
  "site",
]

[profile.dev.package."*"]
opt-level = 3

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
strip = "debuginfo"
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
